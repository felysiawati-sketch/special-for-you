<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Terimakasih ♡</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">
</head>

<body>

    <main class="thankyou-page">

        <!-- Hearts -->
        <span class="thank-heart th1">♡</span>
        <span class="thank-heart th2">♥</span>
        <span class="thank-heart th3">♡</span>
        <span class="thank-heart th4">♥</span>
        <span class="thank-heart th5">♡</span>

        <section class="thankyou-content">

            <p class="thank-small">Untuk kakakk</p>

            <h1>
                Adekk mau bilang<br>
                <span>Terimakasii banyak ♡</span>
            </h1>


            <!-- =========================
                 6 KOTAK
            ========================== -->

            <div class="thank-cards">

                <!-- CARD 1 -->
                <div class="thank-card">
                    <div class="card-heart">♡</div>

                    <h2>Thank you<br>for being kind <br>to me</h2>

                    <button class="read-button"
                        onclick="openLetter(
                        'Terimakasiii sudaa baikk samaa adee♡',
                        'Makasiii banyakkk yaa kakakkk, udaa baikk banget samaa adee.🥺 makasiii selama inii kakakk udaa memeperlakukan adee dengan baikk, selalu sabar dan memberi kebaikan yang mungkin buatt kakakk  sederhana. Please always be kind to yourself too, kak. you deserve all the good things in this world.♡'
                        )">
                        Selengkapnya ♡
                    </button>
                </div>


                <!-- CARD 2 -->
                <div class="thank-card">
                    <div class="card-heart">♡</div>

                    <h2>Thank you<br>for your advice</h2>

                    <button class="read-button"
                        onclick="openLetter(
                        'Terimakakasii nasihattnyaa♡',
                        'Makasiii banyakkk yaaa, kakakk. karena udaa mau ngasih adee nasihat, udaa mau ngingetin adee ketika adee mungkin belum memahami sesuatu, dan udaa mau berbagi sudut pandang yang mungkin sebelumnya nggak pernah adee pikirin🥺. semoga suatu hari nanti adee bisa menerapkan hal-hal baik yang udaa kakak ajarin. your advice means more to me than you know.♡'
                        )">
                        Selengkapnya ♡
                    </button>
                </div>


                <!-- CARD 3 -->
                <div class="thank-card">
                    <div class="card-heart">♡</div>

                    <h2>Thank you<br>for listening</h2>

                    <button class="read-button"
                        onclick="openLetter(
                        'Terimakasii suda menengarkan adee ♡',
                        'Terimakasiii yaa, kakk, sudaa mau mendengarkan ceritaa-ceritaa adee. Terimakasiii kerena sudaa memberikan ruang untuk adee bercerita tanpa merasaa sendirian. Sesederhana itu, tapi berartii banyakk buatt adeee (つ﹏<。) '
                        )">
                        Selengkapnya♡
                    </button>
                </div>


                <!-- CARD 4 -->
                <div class="thank-card">
                    <div class="card-heart">♡</div>

                    <h2>Thank you<br>for your time</h2>

                    <button class="read-button"
                        onclick="openLetter(
                        'Terimakasiii untukk waktu yang kakak berikan ♡',
                        'Terimakasii sudaa menyempatkan waktu untuk adee, kakk. adee tauu kakak juga punya kesibukan sendiri, jadi setiap waktu yang kakakk luangkan untuk adee selalu adee hargaii. Mungkin bagi kakak itu hal biasa, tapi bagi adee, bisa ngobrol dan berbagi cerita sama kakak adalah hal yang menyenangkan ⸜(｡˃ ᵕ ˂ )⸝♡'
                        )">
                        Selengkapnya♡ ♡
                    </button>
                </div>


                <!-- CARD 5 -->
                <div class="thank-card">
                    <div class="card-heart">♡</div>

                    <h2>Thank you<br>for the little<br>things</h2>

                    <button class="read-button"
                        onclick="openLetter(
                        'Terimakasii untuk hal-hal kecill ♡',
                        'Terimakasiii kakk untuk hal-hal kecil yang mungkin kakakk sendiri nggak pernaa sadar kalau itu berarti buat adee. kadang, sesuatu yang sederhana bisa meninggalkan kesan yang cukup dalam. mungkin kakak sudaa lupaa, tapi adee masii mengingatnya (๑•ᴗ•๑)♡.'
                        )">
                        Selengkapnya ♡
                    </button>
                </div>


                <!-- CARD 6 -->
                <div class="thank-card">
                    <div class="card-heart">♡</div>

                    <h2>Thank you<br>for being here</h2>

                    <button class="read-button"
                        onclick="openLetter(
                        'Terimakasii sudaa hadirr di hidup adee ♡',
                        'Terimakasiii sudaa hadirr di bagian kecil dari hidupp adee, kakk. adee nggak tau sampaii kapan kitaa akan saling mengenal, tapi adee senang karena pernaa di pertemukan dengan seseorang seperti kakakk. semoga hal-hal baik selalu menemukan kakakk dimana pun kakakk berada, yaa(ノ_<。).'
                        )">
                        Selengkapnya♡ 
                    </button>
                </div>

            </div>


            <button class="next-button"
                onclick="window.location.href='support.html'">
                masii adaa, lanjutt yukk ♡
            </button>

        </section>

    </main>


    <!-- =========================
         POP-UP SURAT
    ========================== -->

    <div class="letter-overlay" id="letterOverlay">

        <div class="big-letter">

            <button class="close-letter"
                onclick="closeLetter()">
                ×
            </button>

            <div class="big-letter-heart">
                ♡
            </div>

            <h2 id="letterTitle">
                Thank you ♡
            </h2>

            <div class="letter-line"></div>

            <p id="letterText">
                Isi pesan akan muncul di sini.
            </p>

            <button class="close-button"
                onclick="closeLetter()">
                close ♡
            </button>

        </div>

    </div>


    <script>

        function openLetter(title, text) {

            document.getElementById("letterTitle").textContent = title;
            document.getElementById("letterText").textContent = text;

            document
                .getElementById("letterOverlay")
                .classList.add("show");

        }


        function closeLetter() {

            document
                .getElementById("letterOverlay")
                .classList.remove("show");

        }


        // Klik area luar kotak untuk menutup
        document
            .getElementById("letterOverlay")
            .addEventListener("click", function(event) {

                if (event.target === this) {
                    closeLetter();
                }

            });

    </script>


</body>
</html>
