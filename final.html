<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One Last Thing ♡</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">
</head>

<body>

    <main class="final-page">

        <!-- FLOATING HEARTS -->

        <span class="final-heart fh1">♡</span>
        <span class="final-heart fh2">♥</span>
        <span class="final-heart fh3">♡</span>
        <span class="final-heart fh4">✦</span>
        <span class="final-heart fh5">♡</span>


        <!-- =========================
             OPENING
        ========================= -->

        <section class="final-opening" id="finalOpening">

            <p class="final-small">
                you made it this far...
            </p>

            <h1>
                one last<br>
                <span>thing ♡</span>
            </h1>

            <div class="envelope-area">

                <div class="final-envelope" id="finalEnvelope">

                    <div class="envelope-back"></div>

                    <div class="envelope-paper">
                        <span>for you ♡</span>
                    </div>

                    <div class="envelope-front"></div>

                    <div class="envelope-flap"></div>

                    <div class="envelope-heart">
                        ♡
                    </div>

                </div>

            </div>

            <button class="open-final-button" onclick="openFinalLetter()">
                open the letter ♡
            </button>

        </section>


        <!-- =========================
             LETTER
        ========================= -->

        <section class="final-letter-section" id="finalLetter">

            <div class="final-letter">

                <div class="letter-top-heart">
                    ♡
                </div>

                <p class="letter-label">
                    a little letter for you
                </p>

                <h2>
                    for you, ♡
                </h2>

                <div class="final-line"></div>

                <div class="typed-letter" id="typedLetter"></div>

                <p class="letter-sign">
                    — Feli ♡
                </p>

                <button
                    class="surprise-button"
                    id="surpriseButton"
                    onclick="showSurprise()">
                    wait... there's one more thing ♡
                </button>

            </div>

        </section>


        <!-- =========================
             SURPRISE
        ========================= -->

        <section class="final-surprise" id="finalSurprise">

            <div class="surprise-content">

                <div class="big-surprise-heart">
                    ♡
                </div>

                <h2>
                    thank you for being<br>
                    part of this little story.
                </h2>

                <p>
                    I hope this tiny website
                    gives you a little smile
                    whenever you remember it.
                </p>

                <div class="surprise-name">
                    — Feli ♡
                </div>

                <div class="final-buttons">

                    <button onclick="location.reload()">
                        read it again ♡
                    </button>

                    <button onclick="window.location.href='index.html'">
                        start from the beginning
                    </button>

                </div>

            </div>

        </section>


        <!-- HEARTS GENERATED BY JS -->

        <div class="heart-container" id="heartContainer"></div>

    </main>


    <script>

        const letterText = `
Hi...

Thank you for making it all the way here.

I made this little website because
there were so many little things
I wanted to put into words.

Maybe some of them are simple,
maybe some are a little silly,
but I hope you know that
every part of this was made sincerely.

I am really glad that I got to know you
and share all those little moments
and memories with you.

Whatever happens next,
I hope you always remember
that you are someone worth appreciating.

Thank you for being you. ♡
`;


        function openFinalLetter() {

            const opening =
                document.getElementById("finalOpening");

            const envelope =
                document.getElementById("finalEnvelope");

            envelope.classList.add("open");

            setTimeout(() => {

                opening.classList.add("hide");

            }, 900);


            setTimeout(() => {

                document
                    .getElementById("finalLetter")
                    .classList.add("show");

                typeLetter();

            }, 1300);

        }


        function typeLetter() {

            const container =
                document.getElementById("typedLetter");

            let index = 0;

            function type() {

                if (index < letterText.length) {

                    container.textContent +=
                        letterText.charAt(index);

                    index++;

                    setTimeout(type, 25);

                }

            }

            type();

        }


        function showSurprise() {

            document
                .getElementById("finalLetter")
                .classList.add("hide");

            setTimeout(() => {

                document
                    .getElementById("finalSurprise")
                    .classList.add("show");

                createHearts();

            }, 700);

        }


        function createHearts() {

            const container =
                document.getElementById("heartContainer");

            const symbols = ["♡", "♥", "✦", "♡"];

            for (let i = 0; i < 35; i++) {

                const heart =
                    document.createElement("span");

                heart.className = "falling-heart";

                heart.textContent =
                    symbols[
                        Math.floor(
                            Math.random() * symbols.length
                        )
                    ];

                heart.style.left =
                    Math.random() * 100 + "%";

                heart.style.animationDuration =
                    (3 + Math.random() * 4) + "s";

                heart.style.animationDelay =
                    Math.random() * 1.5 + "s";

                heart.style.fontSize =
                    (10 + Math.random() * 16) + "px";

                container.appendChild(heart);

            }

        }

    </script>

</body>

</html>
